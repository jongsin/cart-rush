# CART RUSH — docker compose up -d 한 방이면 끝!
# 호스트 포트를 바꾸고 싶으면: HOST_PORT=8080 docker compose up -d
services:
  cart-rush:
    build: .
    image: cart-rush
    container_name: cart-rush
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      # 프록시가 프리픽스를 안 떼주는 경우에만: BASE_PATH=/cart-rush docker compose up -d
      BASE_PATH: ${BASE_PATH:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
